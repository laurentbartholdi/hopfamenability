version: v0.4
project:
  name: Amenability of Lie, group and Hopf algebras
  description: 'Formalization of manuscript Theorems A–J: coalgebraic rounding and the equivalence
    of algebraic and coalgebraic amenability; quotient, subalgebra and cleft-extension results
    for Hopf algebras; amenability of permutation-module quotients and all nonzero modules of
    amenable groups; Lie-algebra growth and permanence; the inclusions EL ⊆ SL ⊆ AL and strictness
    of EL ⊆ SL; an amenable finitely generated Lie algebra of exponential growth; and amenability
    of the augmentation-associated graded module coalgebra. All 21 compared declarations use
    only standard Lean axioms. Theorem D and the equivalence form of E explicitly assume projectivity
    over the displayed Hopf subalgebra. The arbitrary-characteristic separation in H explicitly
    assumes the positive-characteristic PSZ construction; the characteristic-zero separation
    and the two hierarchy inclusions are unconditional. These conditional claims do not certify
    the literature inputs themselves.'
  authors:
  - Laurent Bartholdi
  responsible_maintainers:
  - Laurent Bartholdi
  license: Apache-2.0
